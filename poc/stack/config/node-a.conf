# rskj regtest — node A (miner). Loaded via -Drsk.conf.file; --regtest supplies the base profile.
# Chain id 33. All hardforks (incl. RSKIP543/545/546 typed transactions) active at height 0.

blockchain.config.name = "regtest"
database.dir = /var/lib/rsk/db

# own advertised IP (static IP of rskj-a on the compose network)
public.ip = "172.28.0.10"

peer {
    discovery.enabled = false
    port = 50501
    networkId = 7771
    # fixed key so node B can pin us as a static peer (nodeId derived from this)
    privateKey = "1111111111111111111111111111111111111111111111111111111111111111"
    # dial node B by its static compose IP (avoids hostname resolution at startup)
    active = [
        { ip = "172.28.0.11", port = 50501, nodeId = "466d7fcae563e5cb09a0d1870bb580344804617879a14949cf22285f1bae3f276728176c3c6431f8eeda4538dc37c865e2784f3a9e77d044f33e407797e1278a" }
    ]
}

# node A mines regtest blocks every second
miner {
    server.enabled = true
    client {
        enabled = true
        delayBetweenBlocks = 1 second
    }
    minGasPrice = 0
    coinbase.secret = "regtest_miner_a"
}

rpc {
    providers.web {
        http {
            enabled = true
            port = 4444
            bind_address = "0.0.0.0"
            hosts = ["localhost", "0.0.0.0", "rskj-a"]
            cors = "*"
        }
        ws.enabled = false
    }
    modules = [
        { name = "eth",     version = "1.0", enabled = "true" },
        { name = "net",     version = "1.0", enabled = "true" },
        { name = "web3",    version = "1.0", enabled = "true" },
        { name = "txpool",  version = "1.0", enabled = "true" },
        { name = "rsk",     version = "1.0", enabled = "true" },
        { name = "debug",   version = "1.0", enabled = "true" },
        { name = "trace",   version = "1.0", enabled = "true" },
        { name = "evm",     version = "1.0", enabled = "true" }
    ]
}

wallet { enabled = true, accounts = [] }

# --- Advanced BTC-ticket path only (see stack/scripts/pegin.md) ---
