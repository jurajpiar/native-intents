# rskj regtest — node A for the REORG scenario (experiment E16).
# Differs from node-a.conf in two ways: (1) on-demand mining only (miner.client.enabled = false, so no
# 1s auto-mine loop — blocks are produced explicitly via evm_mine, giving deterministic control while the
# two nodes are partitioned); (2) node B is also a miner here, so both can build competing chains.
# The evm_mine RPC still works with the client disabled: rskj always constructs the MinerClient bean;
# `client.enabled` only governs whether the background auto-mine service starts.

blockchain.config.name = "regtest"
database.dir = /var/lib/rsk/db

public.ip = "172.29.0.10"

peer {
    discovery.enabled = false
    port = 50501
    networkId = 7771
    # same key as node-a.conf, so the derived nodeId that node B pins is unchanged
    privateKey = "1111111111111111111111111111111111111111111111111111111111111111"
    active = [
        { ip = "172.29.0.11", port = 50501, nodeId = "466d7fcae563e5cb09a0d1870bb580344804617879a14949cf22285f1bae3f276728176c3c6431f8eeda4538dc37c865e2784f3a9e77d044f33e407797e1278a" }
    ]
}

# miner enabled but NOT auto-mining: evm_mine drives one block at a time
miner {
    server.enabled = true
    client {
        enabled = false
        autoMine = false
        delayBetweenBlocks = 0 seconds
    }
    minGasPrice = 0
    coinbase.secret = "regtest_miner_a"
}

rpc {
    providers.web {
        http {
            enabled = true
            port = 4444
            bind_address = "0.0.0.0"
            hosts = ["localhost", "0.0.0.0", "rskj-a-reorg"]
            cors = "*"
        }
        ws.enabled = false
    }
    modules = [
        { name = "eth",     version = "1.0", enabled = "true" },
        { name = "net",     version = "1.0", enabled = "true" },
        { name = "web3",    version = "1.0", enabled = "true" },
        { name = "txpool",  version = "1.0", enabled = "true" },
        { name = "rsk",     version = "1.0", enabled = "true" },
        { name = "debug",   version = "1.0", enabled = "true" },
        { name = "trace",   version = "1.0", enabled = "true" },
        { name = "evm",     version = "1.0", enabled = "true" }
    ]
}

wallet { enabled = true, accounts = [] }
