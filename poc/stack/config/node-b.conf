# rskj regtest — node B (non-mining full node, peered to A). Used for the gossip half of claim 1:
# an intent submitted to one node should appear in the other node's mempool.

blockchain.config.name = "regtest"
database.dir = /var/lib/rsk/db

# own advertised IP (static IP of rskj-b on the compose network)
public.ip = "172.28.0.11"

peer {
    discovery.enabled = false
    port = 50501
    networkId = 7771
    privateKey = "2222222222222222222222222222222222222222222222222222222222222222"
    # dial node A by its static compose IP
    active = [
        { ip = "172.28.0.10", port = 50501, nodeId = "4f355bdcb7cc0af728ef3cceb9615d90684bb5b2ca5f859ab0f0b704075871aa385b6b1b8ead809ca67454d9683fcf2ba03456d6fe2c4abe2b07f0fbdbb2f1c1" }
    ]
}

# node B does not mine — it only follows A and gossips transactions
miner {
    server.enabled = false
    client.enabled = false
    minGasPrice = 0
}

rpc {
    providers.web {
        http {
            enabled = true
            port = 4444
            bind_address = "0.0.0.0"
            hosts = ["localhost", "0.0.0.0", "rskj-b"]
            cors = "*"
        }
        ws.enabled = false
    }
    modules = [
        { name = "eth",     version = "1.0", enabled = "true" },
        { name = "net",     version = "1.0", enabled = "true" },
        { name = "web3",    version = "1.0", enabled = "true" },
        { name = "txpool",  version = "1.0", enabled = "true" },
        { name = "rsk",     version = "1.0", enabled = "true" },
        { name = "debug",   version = "1.0", enabled = "true" }
    ]
}

wallet { enabled = true, accounts = [] }
