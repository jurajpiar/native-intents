# bitcoind regtest for the native-intent PoC.
# rskj does NOT connect to bitcoind (rskj has no bitcoind integration). bitcoind is here for the
# harness to build BTC transactions and, on the advanced path, to drive Bridge peg-ins.
regtest=1
server=1
txindex=1
fallbackfee=0.0002
[regtest]
rpcuser=rsk
rpcpassword=rsk
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=18443
# p2p not needed (single node), but harmless
listen=1
