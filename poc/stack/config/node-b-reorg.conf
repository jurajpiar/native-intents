# rskj regtest — node B for the REORG scenario (experiment E16).
# Unlike node-b.conf (a non-mining follower), here B is a full miner too, on-demand only, so it can build
# a competing (heavier) chain while node A is partitioned off. See node-a-reorg.conf for the rationale.

blockchain.config.name = "regtest"
database.dir = /var/lib/rsk/db

public.ip = "172.29.0.11"

peer {
    discovery.enabled = false
    port = 50501
    networkId = 7771
    # same key as node-b.conf, so the derived nodeId that node A pins is unchanged
    privateKey = "2222222222222222222222222222222222222222222222222222222222222222"
    active = [
        { ip = "172.29.0.10", port = 50501, nodeId = "4f355bdcb7cc0af728ef3cceb9615d90684bb5b2ca5f859ab0f0b704075871aa385b6b1b8ead809ca67454d9683fcf2ba03456d6fe2c4abe2b07f0fbdbb2f1c1" }
    ]
}

# B is a miner here (on-demand), so it can out-mine A during the partition
miner {
    server.enabled = true
    client {
        enabled = false
        autoMine = false
        delayBetweenBlocks = 0 seconds
    }
    minGasPrice = 0
    coinbase.secret = "regtest_miner_b"
}

rpc {
    providers.web {
        http {
            enabled = true
            port = 4444
            bind_address = "0.0.0.0"
            hosts = ["localhost", "0.0.0.0", "rskj-b-reorg"]
            cors = "*"
        }
        ws.enabled = false
    }
    modules = [
        { name = "eth",     version = "1.0", enabled = "true" },
        { name = "net",     version = "1.0", enabled = "true" },
        { name = "web3",    version = "1.0", enabled = "true" },
        { name = "txpool",  version = "1.0", enabled = "true" },
        { name = "rsk",     version = "1.0", enabled = "true" },
        { name = "debug",   version = "1.0", enabled = "true" },
        { name = "trace",   version = "1.0", enabled = "true" },
        { name = "evm",     version = "1.0", enabled = "true" }
    ]
}

wallet { enabled = true, accounts = [] }
